# KeyGo on the Hostinger VPS, next to the existing apps.
#
# - Host networking, like the VPS's Traefik: each app listens only on 127.0.0.1 on its own port,
#   so nothing is exposed directly and the API reaches the host PostgreSQL at localhost:5432.
# - No ports are published, so the existing apps' ports (3000, 4000, ...) are untouched.
# - Traefik picks the containers up from their labels. Every router and service name starts
#   with `keygo-`, so they cannot clash with the existing apps' routes.
#
# Run from this folder:  docker compose up -d --build
name: keygo

services:
  api:
    build: ../server
    image: keygo-api:latest
    container_name: keygo-api
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOST: 127.0.0.1
      PORT: ${API_PORT}
      CORS_ORIGINS: https://${ADMIN_DOMAIN},https://${APP_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FILE_STORAGE_DIR: /app/storage
    volumes:
      - keygo-storage:/app/storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.keygo-api.entrypoints=websecure
      - traefik.http.routers.keygo-api.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-api.loadbalancer.server.port=${API_PORT}

  admin:
    build: ../admin
    image: keygo-admin:latest
    container_name: keygo-admin
    network_mode: host
    restart: unless-stopped
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${ADMIN_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.keygo-admin.entrypoints=websecure
      - traefik.http.routers.keygo-admin.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-admin.loadbalancer.server.port=${ADMIN_PORT}

  customer:
    build: ../customer
    image: keygo-customer-web:latest
    container_name: keygo-customer-web
    network_mode: host
    restart: unless-stopped
    environment:
      CUSTOMER_PORT: ${CUSTOMER_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.keygo-app.entrypoints=websecure
      - traefik.http.routers.keygo-app.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-app.loadbalancer.server.port=${CUSTOMER_PORT}

volumes:
  # Uploaded documents, photos and signatures; survives container rebuilds
  keygo-storage:
