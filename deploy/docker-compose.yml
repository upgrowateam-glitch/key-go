# KeyGo on the Hostinger VPS, next to the existing apps.
#
# - Host networking, like the VPS's Traefik: each app listens only on 127.0.0.1 on its own port,
#   so nothing is exposed directly.
# - The database runs in the `db` container (PostgreSQL 18) on 127.0.0.1:${DB_PORT}, with its data
#   in the `keygo-pgdata` volume. It is separate from the other apps' PostgreSQL containers.
# - No ports are published, so the existing apps' ports (3000, 4000, 5432, ...) are untouched.
# - Traefik picks the containers up from their labels. Every router and service name starts
#   with `keygo-`, so they cannot clash with the existing apps' routes.
#
# Run from this folder:  docker compose up -d --build
name: keygo

services:
  db:
    image: postgres:18
    container_name: keygo-db
    network_mode: host
    restart: unless-stopped
    # Listen on localhost only, on KeyGo's own port
    command: ["postgres", "-c", "listen_addresses=127.0.0.1", "-c", "port=${DB_PORT}"]
    environment:
      POSTGRES_DB: keygo
      POSTGRES_USER: keygo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql
      - keygo-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT} -U keygo -d keygo"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ../server
    image: keygo-api:latest
    container_name: keygo-api
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://keygo:${DB_PASSWORD}@127.0.0.1:${DB_PORT}/keygo?schema=public
      HOST: 127.0.0.1
      PORT: ${API_PORT}
      # The live sites, plus the local dev servers (admin npm run dev, Expo web) so they can use this API too.
      # The phone app is not limited by this list. Every data route still needs a sign-in token.
      CORS_ORIGINS: https://${ADMIN_DOMAIN},https://${APP_DOMAIN},http://localhost:3000,http://localhost:8081
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      FILE_STORAGE_DIR: /app/storage
    volumes:
      - keygo-storage:/app/storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.keygo-api.entrypoints=websecure
      - traefik.http.routers.keygo-api.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-api.loadbalancer.server.port=${API_PORT}

  admin:
    build: ../admin
    image: keygo-admin:latest
    container_name: keygo-admin
    network_mode: host
    restart: unless-stopped
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${ADMIN_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-admin.rule=Host(`${ADMIN_DOMAIN}`)
      - traefik.http.routers.keygo-admin.entrypoints=websecure
      - traefik.http.routers.keygo-admin.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-admin.loadbalancer.server.port=${ADMIN_PORT}

  customer:
    build: ../customer
    image: keygo-customer-web:latest
    container_name: keygo-customer-web
    network_mode: host
    restart: unless-stopped
    environment:
      CUSTOMER_PORT: ${CUSTOMER_PORT}
    labels:
      - traefik.enable=true
      - traefik.http.routers.keygo-app.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.keygo-app.entrypoints=websecure
      - traefik.http.routers.keygo-app.tls.certresolver=letsencrypt
      - traefik.http.services.keygo-app.loadbalancer.server.port=${CUSTOMER_PORT}

volumes:
  # KeyGo database files; survives container restarts and rebuilds
  keygo-pgdata:
  # Uploaded documents, photos and signatures; survives container rebuilds
  keygo-storage:
